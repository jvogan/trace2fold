<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Third-predictor sensitivity: Apple SimpleFold 3B agreement with primary predictors" style="max-width:100%;height:auto;display:block;">
