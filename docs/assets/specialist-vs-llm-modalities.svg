<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-label="Inverse-folding specialists versus zero-tool language models across input modalities" style="max-width:100%;height:auto;display:block;">
  <defs>
    <style>
      .mm-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mm-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace; }
    </style>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafd"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="343" rx="16" fill="url(#mm-bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="20" y="32" class="mm-sans" font-size="18" font-weight="700" fill="#0f172a">Inverse-folding specialists versus zero-tool language models across input modalities</text>

  <!-- Subtitle + Inline Legend -->
  <text x="20" y="53" class="mm-sans" font-size="12.5" fill="#475569">Mean spacefill-v4 score (0 to 100) and tight-fit rate (&lt;= 2.0 Å in both predictors)</text>
  <rect x="590" y="42" width="12" height="12" rx="3" fill="#1a73e8"/>
  <text x="607" y="53" class="mm-sans" font-size="12.5" font-weight="600" fill="#1e293b">Stage 1 (18 shapes)</text>
  <rect x="746" y="42" width="12" height="12" rx="3" fill="#7c3aed"/>
  <text x="763" y="53" class="mm-sans" font-size="12.5" font-weight="600" fill="#1e293b">Stage 2 (6 shapes, 176 aa)</text>

  <!-- Inner White Card -->
  <rect x="18" y="64" width="924" height="266" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Gridlines & X ticks -->
  <line x1="282.0" y1="74" x2="282.0" y2="298" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="282.0" y="317" text-anchor="middle" class="mm-mono" font-size="12" font-weight="600" fill="#475569">0</text>
  <line x1="392.0" y1="74" x2="392.0" y2="298" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="392.0" y="317" text-anchor="middle" class="mm-mono" font-size="12" font-weight="600" fill="#475569">25</text>
  <line x1="502.0" y1="74" x2="502.0" y2="298" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="502.0" y="317" text-anchor="middle" class="mm-mono" font-size="12" font-weight="600" fill="#475569">50</text>
  <line x1="612.0" y1="74" x2="612.0" y2="298" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="612.0" y="317" text-anchor="middle" class="mm-mono" font-size="12" font-weight="600" fill="#475569">75</text>
  <line x1="722.0" y1="74" x2="722.0" y2="298" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="722.0" y="317" text-anchor="middle" class="mm-mono" font-size="12" font-weight="600" fill="#475569">100</text>
  <line x1="282.0" y1="298" x2="722.0" y2="298" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="928" y="317" text-anchor="end" class="mm-sans" font-size="12" font-weight="600" fill="#64748b">spacefill-v4 score (0 to 100)</text>

