  <rect x="282.0" y="78.0" width="403.5" height="16" rx="4" fill="#1a73e8"/>
  <text x="693.5" y="90.5" class="mm-mono" font-size="12" font-weight="700" fill="#1e40af">91.70 (17/18 &lt;= 2 Å)</text>
  <rect x="282.0" y="97.0" width="401.1" height="16" rx="4" fill="#7c3aed"/>
  <text x="691.1" y="109.5" class="mm-mono" font-size="12" font-weight="700" fill="#6d28d9">91.15 (6/6 &lt;= 2 Å)</text>
  <line x1="30" y1="117.5" x2="928" y2="117.5" stroke="#f1f5f9" stroke-width="1.1"/>
  <text x="32" y="136.5" class="mm-sans" font-size="13.5" font-weight="700" fill="#0f172a">Vanilla ProteinMPNN</text>
  <text x="32" y="153.5" class="mm-sans" font-size="12" fill="#64748b">4-atom N-Cα-C-O · 4 draws</text>
  <rect x="282.0" y="122.0" width="402.0" height="16" rx="4" fill="#1a73e8"/>
  <text x="692.0" y="134.5" class="mm-mono" font-size="12" font-weight="700" fill="#1e40af">91.37 (17/18 &lt;= 2 Å)</text>
  <rect x="282.0" y="141.0" width="409.9" height="16" rx="4" fill="#7c3aed"/>
  <text x="699.9" y="153.5" class="mm-mono" font-size="12" font-weight="700" fill="#6d28d9">93.15 (5/6 &lt;= 2 Å)</text>
  <line x1="30" y1="161.5" x2="928" y2="161.5" stroke="#f1f5f9" stroke-width="1.1"/>
  <text x="32" y="180.5" class="mm-sans" font-size="13.5" font-weight="700" fill="#0f172a">RFD4-Proteina</text>
  <text x="32" y="197.5" class="mm-sans" font-size="12" fill="#64748b">Native generator sequence</text>
  <rect x="282.0" y="166.0" width="399.8" height="16" rx="4" fill="#1a73e8"/>
  <text x="689.8" y="178.5" class="mm-mono" font-size="12" font-weight="700" fill="#1e40af">90.87 (17/18 &lt;= 2 Å)</text>
  <rect x="282.0" y="185.0" width="402.2" height="16" rx="4" fill="#7c3aed"/>
  <text x="692.2" y="197.5" class="mm-mono" font-size="12" font-weight="700" fill="#6d28d9">91.40 (5/6 &lt;= 2 Å)</text>
  <line x1="30" y1="205.5" x2="928" y2="205.5" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="32" y="224.5" class="mm-sans" font-size="13.5" font-weight="700" fill="#1e40af">Best zero-tool LLM</text>
  <text x="32" y="241.5" class="mm-sans" font-size="12" fill="#64748b">Cα + unit vector text · 1 shot</text>
  <rect x="282.0" y="210.0" width="250.7" height="16" rx="4" fill="#1a73e8"/>
  <text x="540.7" y="222.5" class="mm-mono" font-size="12" font-weight="700" fill="#1e40af">56.98 Carbon High (4/18 &lt;= 2 Å)</text>
  <rect x="282.0" y="229.0" width="204.3" height="16" rx="4" fill="#7c3aed"/>
  <text x="494.3" y="241.5" class="mm-mono" font-size="12" font-weight="700" fill="#6d28d9">46.44 Neon High (0/6 &lt;= 2 Å)</text>
  <line x1="30" y1="249.5" x2="928" y2="249.5" stroke="#f1f5f9" stroke-width="1.1"/>
  <text x="32" y="268.5" class="mm-sans" font-size="13.5" font-weight="700" fill="#b45309">Local H/E/C rule</text>
  <text x="32" y="285.5" class="mm-sans" font-size="12" fill="#64748b">1D labels · 0 3D coords</text>
  <rect x="282.0" y="254.0" width="75.2" height="16" rx="4" fill="#1a73e8"/>
  <text x="365.2" y="266.5" class="mm-mono" font-size="12" font-weight="700" fill="#1e40af">17.10 (0/18 &lt;= 2 Å)</text>
  <rect x="282.0" y="273.0" width="42.8" height="16" rx="4" fill="#7c3aed"/>
  <text x="332.8" y="285.5" class="mm-mono" font-size="12" font-weight="700" fill="#6d28d9">9.72 (0/6 &lt;= 2 Å)</text>
