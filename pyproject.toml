[project]
name = "trace2fold"
version = "0.4.0"
description = "Trace2Fold: Zero-tool 3D protein inverse-folding benchmark for language models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Vogan" }]
requires-python = ">=3.11"
keywords = [
    "protein-design",
    "inverse-folding",
    "benchmark",
    "llm-evaluation",
    "structural-biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Homepage = "https://github.com/jvogan/trace2fold"
Documentation = "https://jvogan.github.io/trace2fold/"
Repository = "https://github.com/jvogan/trace2fold"

[project.scripts]
trace2fold = "trace2fold.cli:main"

[project.optional-dependencies]
folding = [
    "modal>=1.4.3",
    "gemmi>=0.7.3",
]
curation = [
    "biotite>=2.0.0; python_version >= '3.12'",
    "networkx>=3.7; python_version >= '3.12'",
]
dev = [
    "biotite>=2.0.0; python_version >= '3.12'",
    "gemmi>=0.7.3",
    "modal>=1.4.3",
    "networkx>=3.7; python_version >= '3.12'",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"data" = "trace2fold/assets/data"
"backends/plain_player.py" = "backends/plain_player.py"
