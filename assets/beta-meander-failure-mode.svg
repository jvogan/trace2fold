<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" role="img" aria-label="Five-strand beta-meander 48-01-b and the alpha-helical salt-bridge failure" style="max-width:100%;height:auto;display:block;">
  <defs>
    <style>
      .st-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .st-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="st-arrow-teal" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="st-arrow-violet" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafd"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="353" rx="16" fill="url(#st-bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="20" y="14" width="114" height="24" rx="12" fill="#ccfbf1"/>
  <text x="77" y="30" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">Target 48-01-b</text>
  <text x="146" y="32" class="st-sans" font-size="18" font-weight="700" fill="#0f172a">Five-strand beta-meander 48-01-b and the alpha-helical salt-bridge failure</text>
  <text x="940" y="31" text-anchor="end" class="st-mono" font-size="12" font-weight="600" fill="#64748b">48 aa</text>

  <!-- Panel 1: Sub-angstrom 5-strand sheet -->
  <g transform="translate(20, 52)">
    <rect width="296" height="288" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="296" height="4" rx="2" fill="#0d9488"/>
    <text x="14" y="28" class="st-sans" font-size="15" font-weight="700" fill="#0f172a">Sub-ångström 5-strand sheet</text>
    <text x="14" y="48" class="st-mono" font-size="12" fill="#475569">Turns 9-10, 19-20, 29-30, 39-40</text>

    <rect x="14" y="60" width="268" height="114" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="38" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">S1</text>
    <text x="76" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">S2</text>
    <text x="114" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">S3</text>
    <text x="152" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">S4</text>
    <text x="190" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">S5</text>

    <line x1="38" y1="86" x2="38" y2="140" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-teal)"/>
    <path d="M 38,146 Q 57,162 76,146" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="76" y1="146" x2="76" y2="92" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-teal)"/>
    <path d="M 76,86 Q 95,72 114,86" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="114" y1="86" x2="114" y2="140" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-teal)"/>
    <path d="M 114,146 Q 133,162 152,146" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="152" y1="146" x2="152" y2="92" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-teal)"/>
    <path d="M 152,86 Q 171,72 190,86" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="190" y1="86" x2="190" y2="140" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-teal)"/>

