    <line x1="80" y1="118" x2="110" y2="112" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="3 2"/>
    <line x1="118" y1="112" x2="148" y2="118" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="3 2"/>
    <line x1="156" y1="118" x2="186" y2="112" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="3 2"/>
    <circle cx="38" cy="112" r="4.2" fill="#1a73e8"/>
    <circle cx="76" cy="118" r="4.2" fill="#1a73e8"/>
    <circle cx="114" cy="112" r="4.2" fill="#1a73e8"/>
    <circle cx="152" cy="118" r="4.2" fill="#1a73e8"/>
    <circle cx="190" cy="112" r="4.2" fill="#1a73e8"/>

    <text x="242" y="104" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#1e40af">Val / Ile</text>
    <text x="242" y="122" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#1e40af">and Thr</text>
    <text x="242" y="140" text-anchor="middle" class="st-sans" font-size="12" fill="#475569">contacts</text>

    <rect x="14" y="186" width="268" height="40" rx="8" fill="#f8fafd" stroke="#cbd5e1"/>
    <text x="24" y="211" class="st-sans" font-size="13.5" font-weight="700" fill="#0f172a">Neon High</text>
    <text x="272" y="211" text-anchor="end" class="st-mono" font-size="13.5" font-weight="700" fill="#0d9488">93.3 (0.60 Å)</text>

    <rect x="14" y="234" width="268" height="40" rx="8" fill="#f8fafd" stroke="#cbd5e1"/>
    <text x="24" y="259" class="st-sans" font-size="13.5" font-weight="700" fill="#0f172a">Fable 5.2 High</text>
    <text x="272" y="259" text-anchor="end" class="st-mono" font-size="13.5" font-weight="700" fill="#0d9488">91.4 (0.76 Å)</text>
  </g>

  <!-- Panel 2: GPT-6.2 Sol High Failure -->
  <g transform="translate(332, 52)">
    <rect width="296" height="288" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.4"/>
    <rect x="0" y="0" width="296" height="4" rx="2" fill="#dc2626"/>
    <text x="14" y="28" class="st-sans" font-size="15" font-weight="700" fill="#0f172a">GPT-6.2 Sol High</text>
    <rect x="196" y="12" width="86" height="24" rx="12" fill="#fef2f2"/>
    <text x="239" y="28" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#dc2626">4.2 / 100</text>
    <text x="14" y="48" class="st-mono" font-size="12" font-weight="700" fill="#b91c1c">16.1 Å · straight 48-aa alpha-helix</text>

    <rect x="14" y="60" width="268" height="114" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M 64,116 Q 94,80 124,116" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4 3"/>
    <path d="M 164,116 Q 194,80 224,116" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4 3"/>
    <text x="94" y="82" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#b45309">Glu/Lys</text>
    <text x="194" y="82" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#b45309">i, i+3/i+4</text>
    <path d="M 28,128 Q 42,106 56,128 T 84,128 T 112,128 T 140,128 T 168,128 T 196,128 T 224,128 T 252,128 T 268,128" fill="none" stroke="#dc2626" stroke-width="3.6" stroke-linecap="round"/>
    <text x="148" y="162" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#991b1b">Straight alpha-helical rod</text>

    <text x="14" y="202" class="st-sans" font-size="13.5" font-weight="600" fill="#0f766e">• Turns at exact 9-10..39-40</text>
    <text x="14" y="230" class="st-sans" font-size="13.5" font-weight="600" fill="#dc2626">• 0 Val/Ile/Thr in strands 2 to 4</text>
    <text x="14" y="258" class="st-sans" font-size="13.5" fill="#1e293b">• Paired Glu/Lys at i, i+3/i+4</text>
  </g>

  <!-- Panel 3: Sol XHigh Fold -->
  <g transform="translate(644, 52)">
    <rect width="296" height="288" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.4"/>
    <rect x="0" y="0" width="296" height="4" rx="2" fill="#7c3aed"/>
    <text x="14" y="28" class="st-sans" font-size="15" font-weight="700" fill="#0f172a">Sol XHigh</text>
    <rect x="136" y="12" width="146" height="24" rx="12" fill="#f3e8ff"/>
    <text x="209" y="28" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#6d28d9">71.2/100 · +67.0</text>
    <text x="14" y="48" class="st-sans" font-size="12.5" font-weight="600" fill="#6d28d9">Folded 5-strand beta-sheet</text>

    <rect x="14" y="60" width="268" height="114" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="38" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">S1</text>
    <text x="76" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">S2</text>
    <text x="114" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">S3</text>
    <text x="152" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">S4</text>
    <text x="190" y="76" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">S5</text>

    <line x1="38" y1="86" x2="38" y2="140" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-violet)"/>
    <path d="M 38,146 Q 57,162 76,146" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="76" y1="146" x2="76" y2="92" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-violet)"/>
    <path d="M 76,86 Q 95,72 114,86" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="114" y1="86" x2="114" y2="140" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-violet)"/>
    <path d="M 114,146 Q 133,162 152,146" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="152" y1="146" x2="152" y2="92" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-violet)"/>
    <path d="M 152,86 Q 171,72 190,86" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <line x1="190" y1="86" x2="190" y2="140" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" marker-end="url(#st-arrow-violet)"/>

    <circle cx="38" cy="112" r="4.2" fill="#0d9488"/>
    <circle cx="76" cy="118" r="4.2" fill="#0d9488"/>
    <circle cx="114" cy="112" r="4.2" fill="#0d9488"/>
    <circle cx="152" cy="118" r="4.2" fill="#0d9488"/>
    <circle cx="190" cy="112" r="4.2" fill="#0d9488"/>

    <text x="242" y="104" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#5b21b6">Restored</text>
    <text x="242" y="122" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">Thr / Val</text>
    <text x="242" y="140" text-anchor="middle" class="st-mono" font-size="12" font-weight="700" fill="#0f766e">and Ile</text>

    <text x="14" y="202" class="st-sans" font-size="13.5" font-weight="600" fill="#6d28d9">• 8,907 versus 3,945 tokens (2.3x)</text>
    <text x="14" y="230" class="st-sans" font-size="13.5" font-weight="600" fill="#0f766e">• Restored Thr/Val/Ile (strands 2-4)</text>
    <text x="14" y="258" class="st-sans" font-size="13.5" fill="#1e293b">• Removed helical salt-bridge spacing</text>
  </g>
</svg>
