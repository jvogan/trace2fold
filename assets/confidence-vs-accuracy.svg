<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-label="Target geometry fit spacefill-v4 versus single-chain predictor confidence" style="max-width:100%;height:auto;display:block;">
  <defs>
    <style>
      .qd-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .qd-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace; }
    </style>
    <linearGradient id="qd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafd"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="368" rx="16" fill="url(#qd-bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="20" y="14" width="150" height="24" rx="12" fill="#e8f0fe"/>
  <text x="95" y="30" text-anchor="middle" class="qd-mono" font-size="12" font-weight="700" fill="#1a73e8">Target fit quadrants</text>
  <text x="182" y="32" class="qd-sans" font-size="18" font-weight="700" fill="#0f172a">Target geometry fit (spacefill-v4) versus single-chain predictor confidence</text>

  <!-- Quadrant background fills inside plot (x=96..936, y=54..314) -->
  <rect x="96" y="54" width="420" height="130" fill="#fef2f2" fill-opacity="0.55"/>
  <rect x="96" y="184" width="420" height="130" fill="#f8fafc"/>
  <rect x="516" y="54" width="210" height="260" fill="#eff6ff" fill-opacity="0.45"/>
  <rect x="726" y="54" width="210" height="130" fill="#f0fdfa" fill-opacity="0.85"/>
  <rect x="726" y="184" width="210" height="130" fill="#f8fafd"/>

  <!-- Plot border and dividers -->
  <rect x="96" y="54" width="840" height="260" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="516" y1="54" x2="516" y2="314" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="96" y1="184" x2="936" y2="184" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="726" y1="54" x2="726" y2="314" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- Two-line rotated Y-axis title centered at y=184, bounded cleanly inside plot height -->
  <text x="20" y="184" text-anchor="middle" transform="rotate(-90 20 184)" class="qd-sans" font-size="13" font-weight="700" fill="#0f172a">Single-chain confidence</text>
  <text x="38" y="184" text-anchor="middle" transform="rotate(-90 38 184)" class="qd-mono" font-size="12" font-weight="600" fill="#475569">(pLDDT and pTM, 0 score pts)</text>

  <!-- Y-axis tick labels -->
  <text x="88" y="76" text-anchor="end" class="qd-mono" font-size="12" font-weight="600" fill="#475569">High</text>
  <text x="88" y="188" text-anchor="end" class="qd-mono" font-size="12" font-weight="600" fill="#475569">Mid</text>
  <text x="88" y="308" text-anchor="end" class="qd-mono" font-size="12" font-weight="600" fill="#475569">Low</text>

  <!-- X-axis ticks and title -->
  <text x="96" y="333" text-anchor="middle" class="qd-mono" font-size="12" font-weight="600" fill="#475569">0</text>
  <text x="306" y="333" text-anchor="middle" class="qd-mono" font-size="12" font-weight="600" fill="#475569">25</text>
  <text x="516" y="333" text-anchor="middle" class="qd-mono" font-size="12" font-weight="700" fill="#0f172a">50</text>
  <text x="726" y="333" text-anchor="middle" class="qd-mono" font-size="12" font-weight="600" fill="#0f766e">75 (2.0 Å zone)</text>
  <text x="936" y="333" text-anchor="end" class="qd-mono" font-size="12" font-weight="600" fill="#475569">100</text>
  <text x="516" y="356" text-anchor="middle" class="qd-sans" font-size="14" font-weight="700" fill="#0f172a">Target geometry fit (spacefill-v4, 0 to 100)</text>

  <!-- 1. TOP-LEFT: Confident wrong fold (uncrossed horizontal leaders) -->
  <line x1="131.3" y1="98" x2="300" y2="98" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="178.3" y1="118" x2="300" y2="118" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="279.1" y1="142" x2="300" y2="142" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.65"/>
  <circle cx="131.3" cy="98" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="178.3" cy="118" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="279.1" cy="142" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="300" y="62" width="206" height="114" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.3"/>
  <text x="310" y="82" class="qd-sans" font-size="14" font-weight="700" fill="#991b1b">Confident wrong fold</text>
  <text x="310" y="102" class="qd-sans" font-size="12.5" fill="#1e293b">• Sol High rod 48-01-b (4.2)</text>
  <text x="310" y="122" class="qd-sans" font-size="12.5" fill="#1e293b">• Crambin 1CRN (9.8)</text>
  <text x="310" y="142" class="qd-sans" font-size="12.5" fill="#1e293b">• Protein A 1BDD (21.8)</text>
  <text x="310" y="164" class="qd-mono" font-size="12" font-weight="700" fill="#dc2626">High pLDDT, low fit</text>

  <!-- 2. BOTTOM-LEFT: Unfolded or unphased -->
  <line x1="239.6" y1="248" x2="300" y2="248" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.75"/>
  <line x1="170.8" y1="272" x2="300" y2="272" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.75"/>
  <circle cx="239.6" cy="248" r="6" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="170.8" cy="272" r="6" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="300" y="210" width="206" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="310" y="230" class="qd-sans" font-size="14" font-weight="700" fill="#1e293b">Unfolded or unphased</text>
  <text x="310" y="252" class="qd-sans" font-size="12.5" fill="#1e293b">• Local H/E/C rule (17.1)</text>
  <text x="310" y="274" class="qd-sans" font-size="12.5" fill="#1e293b">• Composition shuffle (8.9)</text>
  <text x="310" y="293" class="qd-mono" font-size="12" fill="#475569">Low pLDDT, low fit</text>

  <!-- 3. MIDDLE-RIGHT: Coarse fold, loose packing (45..60 fit) -->
  <line x1="544.6" y1="194" x2="544.6" y2="216" stroke="#0d9488" stroke-width="1.2"/>
  <line x1="574.8" y1="172" x2="574.8" y2="216" stroke="#1a73e8" stroke-width="1.2"/>
  <circle cx="544.6" cy="194" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="574.8" cy="172" r="6" fill="#1a73e8" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="526" y="216" width="256" height="90" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="536" y="236" class="qd-sans" font-size="14" font-weight="700" fill="#1e40af">Coarse fold, loose packing</text>
  <text x="536" y="256" class="qd-sans" font-size="12.5" fill="#1e293b">• Carbon High Stage 1 mean (57.0)</text>
  <text x="536" y="276" class="qd-sans" font-size="12.5" fill="#1e293b">• Neon High mean (53.4)</text>
  <text x="536" y="296" class="qd-mono" font-size="12" fill="#475569">45 to 60 fit · ~2.1 Å, ~43% F1</text>

  <!-- 4. TOP-RIGHT: Sub-2 A target match (uncrossed horizontal leaders) -->
  <line x1="886.4" y1="98" x2="854" y2="98" stroke="#1a73e8" stroke-width="1.2"/>
  <line x1="879.7" y1="118" x2="854" y2="118" stroke="#0d9488" stroke-width="1.2"/>
  <circle cx="886.4" cy="98" r="6.5" fill="#1a73e8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="879.7" cy="118" r="6.5" fill="#0d9488" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="614" y="62" width="240" height="108" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.4"/>
  <text x="624" y="82" class="qd-sans" font-size="14" font-weight="700" fill="#0f766e">Sub-2 Å target match</text>
  <text x="624" y="102" class="qd-sans" font-size="12.5" font-weight="600" fill="#1e293b">• RFD4 bank mean (94.1)</text>
  <text x="624" y="122" class="qd-sans" font-size="12.5" font-weight="600" fill="#1e293b">• Neon 48-01-b (93.3, 0.60 Å)</text>
  <text x="624" y="144" class="qd-mono" font-size="12" font-weight="700" fill="#0f766e">High confidence and</text>
  <text x="624" y="160" class="qd-mono" font-size="12" font-weight="700" fill="#0f766e">&lt;= 2.0 Å in both predictors</text>
</svg>
